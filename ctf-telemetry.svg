<svg width="680" height="330" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF003C"/>
      <stop offset="100%" stop-color="#8B0015"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill: #050505; }
      .frame { fill: none; stroke: #FF003C; stroke-width: 1.2; opacity: 0.6; }
      .title { font-family: 'Courier New', monospace; font-size: 15px; fill: #FF003C; letter-spacing: 2px; }
      .label { font-family: 'Courier New', monospace; font-size: 13px; fill: #e6e6e6; }
      .pct { font-family: 'Courier New', monospace; font-size: 13px; fill: #FF003C; font-weight: bold; opacity: 0; }
      .track { fill: #161616; }
      .bar { fill: url(#barGrad); filter: url(#glow); transform-box: fill-box; transform-origin: left center; }
      .cursor { fill: #FF003C; animation: blink 1.1s steps(1) infinite; }

      @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
      @keyframes fadein { to { opacity: 1; } }

      @keyframes grow1 { from { transform: scaleX(0); } to { transform: scaleX(0.95); } }
      @keyframes grow2 { from { transform: scaleX(0); } to { transform: scaleX(0.85); } }
      @keyframes grow3 { from { transform: scaleX(0); } to { transform: scaleX(0.75); } }
      @keyframes grow4 { from { transform: scaleX(0); } to { transform: scaleX(0.65); } }
      @keyframes grow5 { from { transform: scaleX(0); } to { transform: scaleX(0.55); } }
      @keyframes grow6 { from { transform: scaleX(0); } to { transform: scaleX(0.45); } }

      .b1 { animation: grow1 1.3s ease-out 0.1s forwards; }
      .b2 { animation: grow2 1.3s ease-out 0.25s forwards; }
      .b3 { animation: grow3 1.3s ease-out 0.4s forwards; }
      .b4 { animation: grow4 1.3s ease-out 0.55s forwards; }
      .b5 { animation: grow5 1.3s ease-out 0.7s forwards; }
      .b6 { animation: grow6 1.3s ease-out 0.85s forwards; }

      .p1 { animation: fadein 0.4s ease-out 1.2s forwards; }
      .p2 { animation: fadein 0.4s ease-out 1.35s forwards; }
      .p3 { animation: fadein 0.4s ease-out 1.5s forwards; }
      .p4 { animation: fadein 0.4s ease-out 1.65s forwards; }
      .p5 { animation: fadein 0.4s ease-out 1.8s forwards; }
      .p6 { animation: fadein 0.4s ease-out 1.95s forwards; }
    </style>
  </defs>

  <rect class="bg" width="680" height="330" rx="10"/>
  <rect class="frame" x="6" y="6" width="668" height="318" rx="8"/>

  <text x="24" y="34" class="title">&gt; CTF OPERATIONS TELEMETRY_<tspan class="cursor">█</tspan></text>
  <line x1="24" y1="46" x2="656" y2="46" stroke="#8B0015" stroke-width="1" opacity="0.5"/>

  <!-- Row 1 -->
  <text x="24" y="82" class="label">Reverse Engineering</text>
  <rect class="track" x="230" y="68" width="380" height="16" rx="3"/>
  <rect class="bar b1" x="230" y="68" width="380" height="16" rx="3"/>
  <text x="618" y="80" class="pct p1">95%</text>

  <!-- Row 2 -->
  <text x="24" y="122" class="label">Binary Exploitation</text>
  <rect class="track" x="230" y="108" width="380" height="16" rx="3"/>
  <rect class="bar b2" x="230" y="108" width="380" height="16" rx="3"/>
  <text x="618" y="120" class="pct p2">85%</text>

  <!-- Row 3 -->
  <text x="24" y="162" class="label">Digital Forensics</text>
  <rect class="track" x="230" y="148" width="380" height="16" rx="3"/>
  <rect class="bar b3" x="230" y="148" width="380" height="16" rx="3"/>
  <text x="618" y="160" class="pct p3">75%</text>

  <!-- Row 4 -->
  <text x="24" y="202" class="label">Cryptography</text>
  <rect class="track" x="230" y="188" width="380" height="16" rx="3"/>
  <rect class="bar b4" x="230" y="188" width="380" height="16" rx="3"/>
  <text x="618" y="200" class="pct p4">65%</text>

  <!-- Row 5 -->
  <text x="24" y="242" class="label">Web Security</text>
  <rect class="track" x="230" y="228" width="380" height="16" rx="3"/>
  <rect class="bar b5" x="230" y="228" width="380" height="16" rx="3"/>
  <text x="618" y="240" class="pct p5">55%</text>

  <!-- Row 6 -->
  <text x="24" y="282" class="label">OSINT</text>
  <rect class="track" x="230" y="268" width="380" height="16" rx="3"/>
  <rect class="bar b6" x="230" y="268" width="380" height="16" rx="3"/>
  <text x="618" y="280" class="pct p6">45%</text>

  <line x1="24" y1="300" x2="656" y2="300" stroke="#8B0015" stroke-width="1" opacity="0.5"/>
  <text x="24" y="318" class="label" fill="#8b0015">root@3lb4r:~# _</text>
</svg>
